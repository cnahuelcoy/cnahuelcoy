<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="170" viewBox="0 0 1120 170" role="img" aria-label="Onda roja sobre fondo transparente">
  <defs>
    <linearGradient id="redFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF1A40" stop-opacity="0.35"/>
      <stop offset="0.35" stop-color="#E00026" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#E00026" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="waveStroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB1BD"/>
      <stop offset="0.4" stop-color="#FF264B"/>
      <stop offset="1" stop-color="#D00024"/>
    </linearGradient>
    <filter id="softGlow" x="-15%" y="-160%" width="130%" height="420%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <!-- No solid background: transparent everywhere except the red wave. -->
