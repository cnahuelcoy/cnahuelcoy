  <path d="M0 52 C160 8 250 105 410 74 S660 -2 807 48 S1040 107 1120 35" fill="none" stroke="#FF0037" stroke-width="16" opacity="0.62" filter="url(#softGlow)"/>
  <path d="M0 52 C160 8 250 105 410 74 S660 -2 807 48 S1040 107 1120 35" fill="none" stroke="url(#waveStroke)" stroke-width="4" stroke-linecap="round"/>
  <path d="M0 85 C190 57 285 117 438 98 S677 46 824 87 S1025 128 1120 69" fill="none" stroke="#E0002C" stroke-width="1.4" opacity="0.22"/>
